appId: com.crosspointsync.app
name: "Test Suite Setup - Connect Mock Device"
---
# Setup flow runs first via config.yaml executionOrder.
# Connects to the mock reader (Android emulator host or iOS localhost) so that
# lastDeviceIp is persisted for all subsequent flows.

# Start from a clean disconnected state
- runFlow: ../helpers/ensure-disconnected.yaml

# Open connection sheet
- tapOn:
    id: "Library.ConnectionPill"
- waitForAnimationToEnd

# Wait for the connect form
- extendedWaitUntil:
    visible:
      id: "Connection.ConnectButton"
    timeout: 5000

# Keep the saved Android host address when already correct. Android taps can
# place the cursor before the final character, so select the old value first.
- runFlow:
    when:
      platform: Android
      notVisible:
        text: "10\\.0\\.2\\.2:8082"
    commands:
      - tapOn:
          text: "crosspoint\\.local|localhost:8082"
      - longPressOn:
          text: "crosspoint\\.local|localhost:8082"
      - runFlow:
          when:
            visible:
              text: "Select all|Select All"
          commands:
            - tapOn: "Select all|Select All"
      - runFlow: ../helpers/input-android-mock-address.yaml
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "crosspoint\\.local|localhost:8082|10\\.0\\.2\\.2:8082"
      - eraseText: 30
      - inputText: "${typeof MOCK_DEVICE_ADDRESS === 'undefined' ? 'localhost:8082' : MOCK_DEVICE_ADDRESS}"

# Dismiss keyboard so Connect button is tappable
- runFlow:
    when:
      platform: iOS
    commands:
      - hideKeyboard

# Tap Connect
- tapOn:
    id: "Connection.ConnectButton"

# Verify connection succeeded — file list should appear
- extendedWaitUntil:
    visible:
      id: "Library.FileList"
    timeout: 15000

# Verify files loaded
- extendedWaitUntil:
    visible:
      id: "Library.FileRow.Articles"
    timeout: 10000
