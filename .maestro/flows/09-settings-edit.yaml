appId: com.crosspointsync.app
name: "Settings - Edit Upload Path"
tags:
  - requires-interaction
---
# Fresh launch to avoid leftover sheet state from prior flows
- stopApp
- launchApp:
    permissions: {}

# Wait for app to load
- extendedWaitUntil:
    visible:
      id: "Library.ConnectionPill|TabBar.Reader"
    timeout: 10000

# Navigate to Settings tab
- runFlow: ../helpers/navigate-to-settings.yaml

- tapOn:
    id: "Settings.UploadPath"

- waitForAnimationToEnd

- assertVisible:
    id: "PromptDialog.Input"
- assertVisible:
    id: "PromptDialog.SubmitButton"
- takeScreenshot: settings-upload-path-edit
