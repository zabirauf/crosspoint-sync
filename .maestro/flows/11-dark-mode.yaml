appId: com.crosspointsync.app
name: "Dark Mode - Library Disconnected"
---
# Maestro 2.10+ controls system appearance on both Android and iOS.
- setDarkMode: enabled
- assertDarkMode

- runFlow: ../helpers/ensure-disconnected.yaml

- assertVisible:
    text: "Library"

- takeScreenshot: library-disconnected-dark

- setDarkMode: disabled
