appId: com.crosspointsync.app
name: "Ensure Disconnected State"
---
# Ensure the app is in a fully disconnected state.
# Opens the ConnectionSheet and taps Disconnect if connected.
# Does two passes to handle the case where auto-reconnect
# completes between the first check and the sheet interaction.

- stopApp
# Preserve permissions; these visual flows do not need camera/media grants.
- launchApp:
    permissions: {}

# Wait for the app to fully load
- extendedWaitUntil:
    visible:
      id: "Library.ConnectionPill"
    timeout: 10000

# Wait for auto-reconnect to complete (or fail) without a JavaScript busy loop.
- extendedWaitUntil:
    notVisible:
      text: "Connecting.*"
    timeout: 15000

# === First disconnect attempt ===
- tapOn:
    id: "Library.ConnectionPill"
- waitForAnimationToEnd

- runFlow:
    when:
      visible:
        id: "Connection.DisconnectButton"
    commands:
      - tapOn:
          id: "Connection.DisconnectButton"
- waitForAnimationToEnd

# Close the sheet
- tapOn:
    id: "Connection.CloseButton"
- waitForAnimationToEnd

# === Second disconnect attempt (handles race condition) ===
- tapOn:
    id: "Library.ConnectionPill"
- waitForAnimationToEnd

- runFlow:
    when:
      visible:
        id: "Connection.DisconnectButton"
    commands:
      - tapOn:
          id: "Connection.DisconnectButton"
- waitForAnimationToEnd

# Close the sheet
- tapOn:
    id: "Connection.CloseButton"
- waitForAnimationToEnd
