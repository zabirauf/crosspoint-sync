id: fab-menu
name: "FAB Menu - Open"
flow: flows/10-fab-menu.yaml
screenshots:
  - fab-menu-open
platforms: [ios, android]
themes: [light]
tags: [smoke, library, fab]

description: |
  The Add menu is expanded, showing action options. It is a native system menu on
  iOS 26+, anchored to a toolbar button in Duo's system rail (or a horizontal
  toolbar when the system uses horizontal bars). Other layouts use a floating menu.
  Options include "Upload Files" with a file or book icon and "Sleep Background" with a moon icon.
  When connected, also shows "New Folder" with a folder icon.

assertions:
  - text: "'Upload Files' option is visible with a file or book icon"
    severity: fail
  - text: "'Sleep Background' option is visible with a moon icon"
    severity: fail
  - text: "The Add control and menu clear system controls and stay within the display"
    severity: fail
  - text: "Menu items have clear separation between them"
    severity: warning

focus_elements:
  - id: "Library.FAB"
    label: "FAB button"
  - id: "FAB.UploadBook"
    label: "Upload book option"

ignore:
  - "Background content behind the overlay"
  - "System status bar"

created_by: human
created_at: "2026-02-20"
