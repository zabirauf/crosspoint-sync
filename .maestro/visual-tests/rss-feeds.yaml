id: rss-feeds
name: "RSS Feeds Screen"
flow: flows/16-rss-feeds.yaml
screenshots:
  - rss-feeds-empty
  - rss-feeds-add-dialog
platforms: [ios, android]
themes: [light]
tags: [settings, rss]

description: |
  RSS feeds management screen, reached from Settings → "Manage feeds".

  rss-feeds-empty: header titled "RSS Feeds". A row of two buttons at the top —
  "Add Feed" (filled/blue) and "Check Now" (plain, disabled while no feeds exist).
  Below them an empty state with an RSS icon, the heading "No feeds yet", and
  explanatory text about adding a feed URL. At the bottom, small grey helper text
  explaining that matching articles are converted to EPUB and queued for upload.

  rss-feeds-add-dialog: a modal prompt titled "Add Feed" with the message
  "Enter an RSS or Atom feed URL", a text input showing the placeholder
  "https://example.com/feed.xml", and Cancel / Add buttons.

  Once feeds exist, each row shows a toggle, the feed title, a "Checked Xm ago" or error
  line, a refresh icon, and a second line of actions: keyword filter, the destination path
  for that feed's articles (e.g. /Rss/lwn-net), and Remove.

assertions:
  - text: "The screen header reads 'RSS Feeds'"
    severity: fail
  - text: "'Add Feed' and 'Check Now' buttons are both visible in a single row"
    severity: fail
  - text: "The empty state shows an RSS icon and the heading 'No feeds yet'"
    severity: fail
  - text: "Helper text at the bottom explains that articles are queued for upload"
    severity: warning
  - text: "In the add-feed screenshot, a dialog titled 'Add Feed' is visible with a URL input"
    severity: fail
  - text: "The dialog input shows a URL placeholder, not a pre-filled value"
    severity: warning
  - text: "Buttons and text use consistent spacing with the rest of the app's settings screens"
    severity: warning

custom_criteria:
  - name: "empty_state_clarity"
    description: "A first-time user can tell what this screen is for and what to do next without prior context"
  - name: "disabled_affordance"
    description: "'Check Now' reads as unavailable (dimmed) when there are no feeds, rather than looking broken"

ignore:
  - "Exact button corner radius and shade of blue"
  - "Status bar contents (time, battery, signal)"

created_by: claude
created_at: "2026-07-26"
