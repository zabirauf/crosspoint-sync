id: library-connected
name: "Library - Connected with Files"
flow: flows/04-library-connected.yaml
screenshots:
  - library-connected-files
platforms: [ios, android]
themes: [light]
tags: [smoke, library, connected, requires-device]

description: |
  Library tab connected to a device, showing a file browser with files and folders.
  Native iOS 26+ has Library, Reader and Settings destinations. Reader uses a
  plain reader outline with no status/notification badge; connection status is
  shown inside Reader. Other builds retain the green connected pill.
  Breadcrumb navigation shows current path (at least "Device" root).
  File list displays entries with file type icons, names, and sizes.
  Add and Uploads use native iOS bars on iOS 26+. On Duo, these actions and the
  Library/Reader/Settings tabs share the system rail when the
  system uses vertical bars. Bottom navigation has a separate blue native Add
  button; Uploads stays in the header. Other platforms retain the floating Add button.

assertions:
  - text: "Reader navigation or the connected pill is visible alongside the populated library"
    severity: fail
  - text: "At least one file or folder is visible in the list"
    severity: fail
  - text: "Each file row shows an icon, filename, and file size or chevron"
    severity: fail
  - text: "The Add control is visible in the toolbar or at the bottom right, without overlapping files"
    severity: fail
  - text: "Folder entries are visually distinct from file entries (folder icon)"
    severity: warning
  - text: "A breadcrumb navigation bar is visible above the file list"
    severity: fail

focus_elements:
  - id: "Library.ConnectionPill"
    label: "Connected pill"
  - id: "Library.FileList"
    label: "File list"
  - id: "Library.FAB"
    label: "Floating action button"

ignore:
  - "Specific file names and sizes (these vary by test data)"
  - "Number of files in the list"
  - "Exact upload progress percentage"

created_by: human
created_at: "2026-02-20"
