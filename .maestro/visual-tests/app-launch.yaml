id: app-launch
name: "App Launch - Initial State"
flow: flows/01-app-launch.yaml
screenshots:
  - app-launch
platforms: [ios, android]
themes: [light]
tags: [smoke, launch]

description: |
  App just launched, showing the Library tab in disconnected state.
  The screen shows a Library title, with a connection pill in older layouts or
  a native Reader destination on iOS 26+. The Reader icon has no dot or badge.
  Main content shows empty state with plug icon and "No Device Connected" message.
  Library (selected), Reader and Settings appear in native tabs or the side
  rail; older layouts have Library and Settings.

assertions:
  - text: "The Library tab title is visible in the header"
    severity: fail
  - text: "Reader navigation or a connection pill is available"
    severity: fail
  - text: "The tab bar shows Library and Settings tabs"
    severity: fail
  - text: "No loading spinners or crash dialogs are visible"
    severity: fail
  - text: "System status text and icons have readable contrast against their background"
    severity: fail

ignore:
  - "Exact timestamp or time display in the status bar"
  - "Battery percentage or signal strength indicators"

created_by: human
created_at: "2026-02-20"
