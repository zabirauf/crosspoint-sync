id: book-formats
name: "Library - Supported File Formats"
flow: flows/16-book-formats.yaml
screenshots:
  - library-book-formats
platforms: [ios, android]
themes: [light]
tags: [library, connected, requires-device]

description: |
  The Formats folder contains Gettysburg-Address.epub, Gettysburg-Address.xtc,
  Gettysburg-Address.xtch, Gettysburg-Address.xtg, and Gettysburg-Address.xth.
  EPUB/XTC/XTCH use blue book icons; XTG/XTH use blue image icons.
  All five rows display a nonzero file size and have a more-actions button.

assertions:
  - text: "The library screenshot shows EPUB/XTC/XTCH with blue book icons and XTG/XTH with blue image icons"
    severity: fail
  - text: "All five filenames are legible and show nonzero file sizes"
    severity: fail

focus_elements:
  - id: "Library.FileList"
    label: "Supported file formats"

ignore:
  - "Exact file sizes"
  - "Status bar time"

created_by: codex
created_at: "2026-10-07"
